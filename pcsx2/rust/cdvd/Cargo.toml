[package]
name = "pcsx2_cdvd"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# CHD format support (pure Rust)
chd = "0.2"

# Compression
flate2 = "1.0"      # zlib/deflate (CSO)
lz4_flex = "0.11"   # lz4 (ZSO)

# Utilities
thiserror = "1.0"
log = "0.4"
