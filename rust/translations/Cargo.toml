[package]
name = "pcsx2_translations"
version = "0.1.0"
edition = "2021"
description = "Idiomatic Rust translations of PCSX2's C/C++ source tree (first-party + 3rdparty). This is a structural/stub translation, not a functional port."

[lib]
path = "lib.rs"

[features]
default = []
first_party = []
thirdparty = []
gs = []
spu2 = []
usb = []

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
