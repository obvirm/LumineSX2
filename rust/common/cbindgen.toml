# cbindgen configuration for pcsx2_common_rs.
# Run via build.rs (automatic) or manually:
#   cbindgen --config cbindgen.toml --crate pcsx2_common_rs --output pcsx2_common_rs.h

language = "C++"
namespace = "pcsx2"
include_guard = "PCSX2_COMMON_RS_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
cpp_compat = true

[enum]
prefix_with_name = true

[fn]
prefix = "pcsx2_"
postfix = ""
args = "horizontal"
sort_by = "name"

[struct]
rename_fields = "None"

[export]
# Only export items annotated with #[no_mangle] and pub extern "C"
# cbindgen exports all pub items by default; we use #[no_mangle] as gate.
exclude = []
include = []

[parse]
parse_deps = false
include = []